<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}IoV Server{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: monospace; max-width: 860px; margin: 2rem auto; padding: 0 1.2rem; color: #222; }
    h1 { border-bottom: 2px solid #222; padding-bottom: .4rem; margin-bottom: 1.5rem; }
    h1 a { color: inherit; text-decoration: none; }
    h2 { margin: 1.8rem 0 .6rem; font-size: 1rem; text-transform: uppercase; letter-spacing: .05em; color: #555; }
    ul { list-style: none; padding: 0; margin: .5rem 0; }
    li { padding: .25rem 0; }
    a { color: #0055cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    pre {
      background: #f6f6f6; border: 1px solid #ddd;
      padding: 1rem; overflow: auto; max-height: 75vh; font-size: .85rem;
    }
    .dim { color: #888; }
    .err { color: #aa0000; }
    .note { font-size: .85rem; color: #888; margin-top: .6rem; }
  </style>
</head>
<body>
  <h1><a href="/">IoV Server</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
