services:
  redis:
    image: redis:7-alpine

  app:
    build:
      context: .
      additional_contexts:
        iov_evaluation: ../iov-evaluation
    ports:
      - "${IOV_SERVER_PORT:-8000}:8000"
    depends_on:
      - redis
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    volumes:
      # The corpus in this repository is the data directory (":Z" relabels it for SELinux).
      - ./iov_data:/data:Z
